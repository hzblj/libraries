<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <link rel="stylesheet" href="libraries-grid.css" />
    <style>
      /* The Libraries card on janblazej.dev, the twin of this site's Portfolio
         card: this site's grid in miniature, its own stills and labels, with a
         link to it held up in front. On hover the grid is dragged about the way
         it is here, each drag settling on a spring, and comes back to where it
         started; as each drag starts, the link's arrow flies off and a new one
         springs back in, as on the Portfolio card. Laid out at 320×240, the
         portfolio's 4:3. */
      .card.portfolio {
        height: 240px;
        width: 320px;
      }

      /* Dark at the edges and darkest along the bottom, where the portfolio
         lays the card's title on hover. */
      .fade {
        background:
          linear-gradient(0deg, #161616 0%, rgba(22, 22, 22, 0.86) 16%, rgba(22, 22, 22, 0) 44%),
          radial-gradient(70% 78% at 50% 40%, rgba(22, 22, 22, 0) 0%, rgba(22, 22, 22, 0.45) 62%, #161616 100%);
        inset: 0;
        position: absolute;
      }

      .link {
        align-items: center;
        backdrop-filter: blur(12px) saturate(1.6);
        background: rgba(24, 24, 24, 0.66);
        border-radius: 22px;
        box-shadow:
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.22),
          0 14px 30px rgba(0, 0, 0, 0.55),
          0 3px 8px rgba(0, 0, 0, 0.35);
        display: flex;
        gap: 9px;
        height: 44px;
        left: 50%;
        padding: 0 16px 0 12px;
        position: absolute;
        top: 78px;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      /* The site's own "h", the favicon, where the Portfolio card has the photo. */
      .link img {
        display: block;
        height: 22px;
        width: 22px;
      }

      .link span {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.1px;
      }

      /* The arrow's box clips it as it leaves and comes back. */
      .link .arrow {
        height: 10px;
        margin-left: 1px;
        opacity: 0.6;
        overflow: hidden;
        width: 10px;
      }

      .link svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="card portfolio">
      <div class="grid"></div>
      <div class="fade"></div>
      <div class="link">
        <img src="/artwork/favicon.svg" />
        <span>libraries.janblazej.dev</span>
        <div class="arrow">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 8 8 2M3.2 2H8v4.8" />
          </svg>
        </div>
      </div>
    </div>
    <script type="module">
      import {arrowOut, mix, spring} from './anim.js'
      import {buildGrid} from './libraries-grid.js'

      const SIZE = {height: 240, width: 320}
      const SCALE = 0.24

      const grid = document.querySelector('.grid')
      const {centre} = buildGrid(grid)

      // Centred on the profile, and the drags it takes from there: they add up
      // to nothing, so the loop closes, and none goes further than the grid
      // runs on past the card.
      const START = {x: SIZE.width / 2 - centre.x * SCALE, y: SIZE.height / 2 - centre.y * SCALE - 8}
      const DRAGS = [
        [-20, -8],
        [12, 14],
        [24, -9],
        [-16, 3],
      ]
      const STEP = 2
      // The link's arrow goes out and comes back as each drag starts, the
      // first as soon as the pointer is on the card.
      const ARROWS = DRAGS.map((_, index) => index * STEP + 0.3)
      const arrow = document.querySelector('.link .arrow svg')

      window.DURATION = STEP * DRAGS.length
      window.FPS = 60

      window.frame = t => {
        let x = START.x
        let y = START.y

        DRAGS.forEach(([dx, dy], index) => {
          const amount = spring(t - index * STEP - 0.3, 1.1, 0.9)
          x += mix(0, dx, amount)
          y += mix(0, dy, amount)
        })

        grid.style.transform = `translate(${x}px, ${y}px) scale(${SCALE})`

        const out = ARROWS.reduce((sum, start) => sum + arrowOut(t - start), 0)
        arrow.style.transform = `translate(${(out * 12).toFixed(2)}px, ${(-out * 12).toFixed(2)}px)`
      }

      window.frame(0)
    </script>
  </body>
</html>
