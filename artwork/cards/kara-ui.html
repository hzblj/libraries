<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      /* kara's mark on the left, and a screen built from real kara components
         (the website's iOS shots, at 3x) rising out of the bottom edge. */
      .glow {
        background: radial-gradient(closest-side, rgba(255, 87, 0, 0.2), rgba(255, 87, 0, 0));
        height: 380px;
        left: -52px;
        position: absolute;
        top: 36px;
        width: 380px;
      }

      .mark {
        height: 100px;
        left: 88px;
        position: absolute;
        top: 176px;
        width: 100px;
      }

      .phone {
        background: #000;
        border-radius: 54px 54px 0 0;
        box-shadow:
          0 0 0 7px #1a1a1a,
          0 0 0 8px rgba(255, 255, 255, 0.13),
          0 30px 80px rgba(0, 0, 0, 0.7);
        font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
        height: 420px;
        left: 266px;
        overflow: hidden;
        padding: 64px 16px 0;
        position: absolute;
        top: 48px;
        width: 302px;
      }

      .status {
        align-items: center;
        display: flex;
        font-size: 15px;
        font-weight: 600;
        justify-content: space-between;
        left: 38px;
        letter-spacing: -0.2px;
        position: absolute;
        right: 28px;
        top: 20px;
      }

      .status svg {
        display: block;
      }

      .glyphs {
        align-items: center;
        display: flex;
        gap: 5px;
      }

      .island {
        background: #111;
        border-radius: 18px;
        height: 30px;
        left: 50%;
        position: absolute;
        top: 12px;
        transform: translateX(-50%);
        width: 96px;
      }

      .title {
        font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.2px;
        margin: 0 4px 14px;
      }

      .phone img {
        display: block;
        margin-bottom: 14px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card large">
      <div class="glow"></div>
      <svg class="mark" viewBox="-4 -4 108 108">
        <path
          fill="#ff5700"
          d="M47.37 35.79v5.99c0 1.51 -0.65 2.95 -1.78 3.95c-1.13 1 -2.64 1.46 -4.14 1.27c-21.47 -2.7 -38.37 -19.61 -41.08 -41.08c-0.19 -1.5 0.28 -3.01 1.27 -4.14c1 -1.13 2.44 -1.78 3.95 -1.78h5.99c19.77 0 35.79 16.02 35.79 35.79zM11.58 100h-5.99c-1.51 0 -2.95 -0.65 -3.95 -1.78c-1 -1.13 -1.46 -2.64 -1.27 -4.14c2.7 -21.47 19.61 -38.37 41.08 -41.08c1.5 -0.19 3.01 0.28 4.14 1.27c1.13 1 1.78 2.44 1.78 3.95v5.99c0 19.77 -16.02 35.79 -35.79 35.79zM88.42 0h5.99c1.51 0 2.95 0.65 3.95 1.78c1 1.13 1.46 2.64 1.27 4.14c-2.7 21.47 -19.61 38.37 -41.08 41.08c-1.5 0.19 -3.01 -0.28 -4.14 -1.27c-1.13 -1 -1.78 -2.44 -1.78 -3.95v-5.99c0 -19.77 16.02 -35.79 35.79 -35.79zM52.63 64.21v-5.99c0 -1.51 0.65 -2.95 1.78 -3.95c1.13 -1 2.64 -1.46 4.14 -1.27c21.47 2.7 38.37 19.61 41.08 41.08c0.19 1.5 -0.28 3.01 -1.27 4.14c-1 1.13 -2.44 1.78 -3.95 1.78h-5.99c-19.77 0 -35.79 -16.02 -35.79 -35.79z"
        />
      </svg>
      <div class="phone">
        <div class="island"></div>
        <div class="status">
          <span>9:41</span>
          <span class="glyphs">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff">
              <rect x="0" y="8" width="3" height="4" rx="1" />
              <rect x="5" y="5.5" width="3" height="6.5" rx="1" />
              <rect x="10" y="3" width="3" height="9" rx="1" />
              <rect x="15" y="0" width="3" height="12" rx="1" />
            </svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff">
              <path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Z" />
              <path d="M8 5.6c1.4 0 2.6.5 3.6 1.4l1.2-1.3A7 7 0 0 0 8 3.8 7 7 0 0 0 3.2 5.7l1.2 1.3c1-.9 2.2-1.4 3.6-1.4Z" />
              <path d="M8 9.1c.6 0 1.1.2 1.5.6L8 11.4 6.5 9.7c.4-.4.9-.6 1.5-.6Z" />
            </svg>
            <svg width="27" height="13" viewBox="0 0 27 13">
              <rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="rgba(255,255,255,0.4)" />
              <rect x="2" y="2" width="20" height="9" rx="2.5" fill="#fff" />
              <path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2Z" fill="rgba(255,255,255,0.4)" />
            </svg>
          </span>
        </div>
        <div class="title">Settings</div>
        <img src="../build/captures/segmented-control.png" data-clip="segmented-control" data-start="0" />
        <img src="../build/captures/switch.png" data-clip="switch" data-start="1" />
        <img src="../build/captures/slider.png" data-clip="slider" data-start="2" />
        <img src="../build/captures/list.png" />
      </div>
    </div>
    <script>
      // On hover the screen comes alive: the segmented control steps through
      // its options, then the switches flip and the slider is dragged, each
      // the component's own recording from the Kara website.
      window.DURATION = 6.8
    </script>
  </body>
</html>
