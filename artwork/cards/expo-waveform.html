<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      /* One team radio message the way the example lays it out, alone in
         the middle: the recording as a waveform that fills with the team's
         colour as it plays, a dot where every word starts, and the words lit
         as they are said. A finger takes the playhead back, ticking at every
         word it crosses (the haptics), and lets go; playback carries on. Drawn
         rather than taken from the example, whose cards carry the drivers'
         photographs. */
      .glow {
        --glow: 255 40 40;
        --strength: 0.18;
        height: 420px;
        left: 88px;
        top: 6px;
        width: 420px;
      }

      .message {
        background: #1c1c1e;
        border-radius: 24px;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.06),
          0 24px 60px rgba(0, 0, 0, 0.5);
        font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
        padding: 18px 20px;
        position: absolute;
      }

      .main {
        background: #232325;
        height: 204px;
        left: 32px;
        top: 112px;
        width: 532px;
      }

      .head {
        align-items: center;
        display: flex;
        gap: 12px;
      }

      .avatar {
        align-items: center;
        background: #3a3a3c;
        border-radius: 50%;
        display: flex;
        flex: none;
        height: 38px;
        justify-content: center;
        width: 38px;
      }

      .who {
        align-items: baseline;
        display: flex;
        font-size: 17px;
        font-weight: 700;
        gap: 8px;
        letter-spacing: -0.2px;
      }

      .number {
        color: #ff3b30;
        font-variant-numeric: tabular-nums;
      }

      .acronym {
        letter-spacing: 1px;
      }

      .role {
        color: rgba(235, 235, 245, 0.6);
        font-size: 15px;
        font-weight: 400;
      }

      .caption {
        color: rgba(235, 235, 245, 0.45);
        font-size: 12px;
        margin-top: 2px;
      }

      .player {
        align-items: center;
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }

      .play {
        align-items: center;
        background: #ff3b30;
        border-radius: 50%;
        display: flex;
        flex: none;
        height: 40px;
        justify-content: center;
        width: 40px;
      }

      .wave {
        flex: 1;
        height: 44px;
        position: relative;
      }

      .bars {
        align-items: center;
        display: flex;
        height: 100%;
        inset: 0;
        justify-content: space-between;
        position: absolute;
      }

      .bars i {
        background: rgba(235, 235, 245, 0.3);
        border-radius: 2px;
        display: block;
        flex: none;
        width: 3.5px;
      }

      .played {
        clip-path: inset(0 100% 0 0);
      }

      .played i {
        background: #ff3b30;
      }

      .cursor {
        background: #fff;
        border-radius: 1px;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        height: 54px;
        left: 0;
        position: absolute;
        top: -5px;
        width: 2px;
      }

      .markers {
        bottom: -12px;
        height: 4px;
        left: 0;
        position: absolute;
        right: 0;
      }

      .markers b {
        background: rgba(235, 235, 245, 0.35);
        border-radius: 50%;
        height: 4px;
        margin-left: -2px;
        position: absolute;
        width: 4px;
      }

      .finger {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        box-shadow:
          inset 0 0 0 1.5px rgba(255, 255, 255, 0.55),
          0 6px 18px rgba(0, 0, 0, 0.35);
        height: 40px;
        left: 0;
        margin: -20px 0 0 -20px;
        opacity: 0;
        position: absolute;
        top: 22px;
        width: 40px;
      }

      .time {
        color: rgba(235, 235, 245, 0.45);
        flex: none;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        min-width: 30px;
        text-align: right;
      }

      .words {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.2px;
        line-height: 22px;
        margin-top: 22px;
        position: relative;
      }

      .words span {
        color: rgba(235, 235, 245, 0.3);
        position: relative;
        z-index: 1;
      }

      .pill {
        background: rgba(255, 59, 48, 0.22);
        border-radius: 6px;
        left: 0;
        position: absolute;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div class="card large">
      <div class="glow"></div>

      <div class="message main">
        <div class="head">
          <div class="avatar"><svg class="helmet" width="22" height="22" viewBox="0 -960 960 960"></svg></div>
          <div>
            <div class="who"><span class="number">7</span><span class="acronym">ENG</span><span class="role">Race engineer</span></div>
            <div class="caption">Team radio · 14:32:08</div>
          </div>
        </div>
        <div class="player">
          <div class="play">
            <svg width="14" height="16" viewBox="0 0 14 16"><rect x="1.5" y="1" width="4" height="14" rx="1.2" fill="#fff" /><rect x="8.5" y="1" width="4" height="14" rx="1.2" fill="#fff" /></svg>
          </div>
          <div class="wave" data-wave="main">
            <div class="bars"></div>
            <div class="bars played"></div>
            <div class="markers"></div>
            <div class="cursor"></div>
            <div class="finger"></div>
          </div>
          <div class="time">0:00</div>
        </div>
        <div class="words"><div class="pill"></div></div>
      </div>
    </div>
    <script type="module">
      import {mix, spring} from './anim.js'

      // Material Symbols' sports-motorsports, the example's stand-in for a driver without a photograph.
      const HELMET =
        '<path fill="rgba(235,235,245,0.6)" d="M480-480Zm88 260q106 0 179-77.5T820-482q0-110-78.5-184T553-740q-56 0-105 13.5T345-684l121 45q51 19 69.5 54.5T554-504q0 60-40 100.5T416-363H146q-5 23-5.5 61.5T140-220h428ZM153-423h257q37 0 60.5-23.5T494-504q0-29-13.5-49T441-582l-154-64q-50 44-83 99t-51 124Zm415 263H140q-24 0-42-18t-18-42v-75q0-108 36-200.5t99.5-160q63.5-67.5 150-106T553-800q67 0 126.5 24.5t104 67.5Q828-665 854-607t26 125q0 66-24.5 125t-67 102.5q-42.5 43.5-99 69T568-160Z"/>'
      for (const helmet of document.querySelectorAll('.helmet')) {
        helmet.innerHTML = HELMET
      }

      // A recording's loudness as speech has it: syllables in bursts, quieter
      // between words, a breath at a comma. Seeded, so every render is the same.
      let seed = 7
      const random = () => {
        seed = (seed * 16807) % 2147483647
        return seed / 2147483647
      }

      const BARS = 54
      const drawBars = wave => {
        const heights = []
        let phase = random() * 6
        for (let index = 0; index < BARS; index++) {
          phase += 0.55 + random() * 0.5
          const syllable = 0.5 + 0.5 * Math.sin(phase)
          const word = index % 9 === 8 ? 0.25 : 1
          heights.push(Math.max(0.1, (0.18 + 0.82 * syllable * (0.55 + random() * 0.45)) * word))
        }
        for (const bars of wave.querySelectorAll('.bars')) {
          bars.innerHTML = heights.map(height => `<i style="height:${(height * 100).toFixed(1)}%"></i>`).join('')
        }
        return heights
      }

      const main = document.querySelector('[data-wave="main"]')
      drawBars(main)

      const TEXT = 'Okay, push now. The gap behind is four seconds, tyres look good to the end.'
      const LENGTH = 9
      const container = document.querySelector('.words')
      const pill = container.querySelector('.pill')

      // Each word's start, as a share of the recording.
      let clock = 0.03
      const WORDS = TEXT.split(' ').map(text => {
        const start = clock
        clock += (0.022 + 0.008 * text.length) * (/[.,]$/.test(text) ? 1.6 : 1)
        return {start, text}
      })
      const scale = 0.96 / clock
      for (const word of WORDS) {
        word.start *= scale
      }

      const spans = WORDS.map(({text}, index) => {
        const span = document.createElement('span')
        span.textContent = text
        container.append(span, index < WORDS.length - 1 ? ' ' : '')
        return span
      })

      const markers = main.querySelector('.markers')
      const dots = WORDS.map(({start}) => {
        const dot = document.createElement('b')
        dot.style.left = `${start * 100}%`
        markers.append(dot)
        return dot
      })

      await document.fonts.ready

      const origin = container.getBoundingClientRect()
      const rects = spans.map(span => {
        const {x, y, width, height} = span.getBoundingClientRect()
        return {height, width, x: x - origin.x, y: y - origin.y}
      })
      const width = main.getBoundingClientRect().width

      // Playing at RATE of the recording a second; held, dragged back, let go.
      const RATE = 0.12
      const START = 0.4
      const PLAY = 2.4
      const TOP = START + RATE * PLAY
      const HOLD = 0.2
      const DRAG = 0.8
      const BACK = 0.16
      const RESUME = PLAY + HOLD + DRAG
      const PERIOD = RESUME + (START - BACK) / RATE

      const clamp = value => Math.min(Math.max(value, 0), 1)
      const inOut = value => (value < 0.5 ? 4 * value ** 3 : 1 - (-2 * value + 2) ** 3 / 2)

      const progressAt = at => {
        if (at < PLAY) {
          return START + RATE * at
        }
        if (at < PLAY + HOLD) {
          return TOP
        }
        if (at < RESUME) {
          return mix(TOP, BACK, inOut((at - PLAY - HOLD) / DRAG))
        }
        return BACK + RATE * (at - RESUME)
      }

      // When the drag crosses each word's dot, for its tick.
      const crossings = WORDS.map(({start}) => {
        if (start > TOP || start < BACK) {
          return null
        }
        let low = PLAY + HOLD
        let high = RESUME
        for (let step = 0; step < 30; step++) {
          const middle = (low + high) / 2
          if (progressAt(middle) > start) {
            low = middle
          } else {
            high = middle
          }
        }
        return low
      })

      const played = main.querySelector('.played')
      const cursor = main.querySelector('.cursor')
      const finger = main.querySelector('.finger')
      const time = document.querySelector('.main .time')
      const PAD = {x: 4, y: 1}

      window.DURATION = PERIOD
      window.FPS = 60

      window.frame = t => {
        const at = t % PERIOD
        const progress = progressAt(at)
        const x = progress * width

        played.style.clipPath = `inset(0 ${((1 - progress) * 100).toFixed(3)}% 0 0)`
        cursor.style.transform = `translateX(${(x - 1).toFixed(2)}px)`
        time.textContent = `0:0${Math.floor(progress * LENGTH)}`

        // The finger comes down just before the drag and lifts as playback resumes.
        const down = spring(at - (PLAY - 0.1), 0.35)
        const up = clamp((at - RESUME) / 0.25)
        const touching = at > PLAY - 0.1 ? clamp(down) * (1 - up) : 0
        Object.assign(finger.style, {
          opacity: touching.toFixed(3),
          transform: `translateX(${x.toFixed(2)}px) scale(${mix(1.25, 1, clamp(down)) + 0.15 * up})`,
        })

        dots.forEach((dot, index) => {
          const lit = WORDS[index].start <= progress
          const crossed = crossings[index]
          const tick = crossed !== null && at >= crossed ? Math.exp(-(at - crossed) * 14) : 0
          dot.style.background = lit ? '#ff3b30' : 'rgba(235, 235, 245, 0.35)'
          dot.style.transform = `scale(${1 + tick * 1.4})`
          dot.style.boxShadow = tick > 0.02 ? `0 0 ${8 * tick}px rgba(255, 80, 70, ${tick})` : 'none'
        })

        const current = WORDS.findLastIndex(({start}) => start <= progress)
        spans.forEach((span, index) => {
          span.style.color = index <= current ? '#fff' : 'rgba(235, 235, 245, 0.3)'
        })

        if (current >= 0) {
          const rect = rects[current]
          Object.assign(pill.style, {
            height: `${rect.height + PAD.y * 2}px`,
            opacity: '1',
            transform: `translate(${rect.x - PAD.x}px, ${rect.y - PAD.y}px)`,
            width: `${rect.width + PAD.x * 2}px`,
          })
        } else {
          pill.style.opacity = '0'
        }
      }

      window.frame(0)
    </script>
  </body>
</html>
