<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      /* One recovery phrase and three chains, signing in turn: the example
         wallet's networks (Sepolia, testnet4 and devnet, each account at the
         path its own wallets use), and under them the message the README signs,
         its 64 bytes settling out of noise as the engine hands them over, with
         the curve and what a signature takes through Nitro (the example's
         Performance screen, iOS). Drawn in the example's manner: kara's grouped
         cards, its ticker badges and its emerald. */
      .glow {
        --glow: 18 163 127;
        --strength: 0.34;
        height: 500px;
        left: 60px;
        top: -30px;
        width: 500px;
      }

      .panel {
        border-radius: 22px;
        font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
        position: absolute;
      }

      .accounts {
        background: #1c1c1e;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.06),
          0 24px 60px rgba(0, 0, 0, 0.5);
        left: 34px;
        padding: 8px;
        top: 36px;
        width: 372px;
      }

      .select {
        background: rgba(18, 163, 127, 0.16);
        border-radius: 15px;
        box-shadow: inset 0 0 0 1px rgba(79, 209, 168, 0.26);
        height: 54px;
        left: 8px;
        position: absolute;
        right: 8px;
        top: 8px;
      }

      .row {
        align-items: center;
        display: flex;
        gap: 12px;
        height: 54px;
        padding: 0 14px 0 10px;
        position: relative;
      }

      /* Kara's hairline between rows, from the text on. */
      .row + .row::before {
        background: rgba(84, 84, 88, 0.5);
        content: '';
        height: 0.5px;
        left: 58px;
        position: absolute;
        right: 14px;
        top: 0;
      }

      .badge {
        align-items: center;
        background: rgba(120, 120, 128, 0.24);
        border-radius: 50%;
        color: #fff;
        display: flex;
        flex: none;
        font-size: 11.5px;
        font-weight: 600;
        height: 36px;
        justify-content: center;
        letter-spacing: -0.1px;
        width: 36px;
      }

      .name {
        color: #fff;
        font-size: 15.5px;
        font-weight: 600;
        letter-spacing: -0.3px;
        line-height: 19px;
      }

      .address {
        color: rgba(235, 235, 245, 0.6);
        font-size: 12.5px;
        letter-spacing: -0.1px;
        line-height: 16px;
        margin-top: 1px;
      }

      .path {
        color: rgba(235, 235, 245, 0.34);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 10.5px;
        margin-left: auto;
      }

      .signature {
        background: #232327;
        box-shadow:
          inset 0 0 0 1px rgba(79, 209, 168, 0.3),
          0 30px 80px rgba(0, 0, 0, 0.6);
        height: 140px;
        left: 186px;
        top: 230px;
        width: 372px;
      }

      .head {
        align-items: center;
        display: flex;
        height: 22px;
        left: 18px;
        position: absolute;
        right: 16px;
        top: 16px;
      }

      .chip {
        align-items: center;
        color: rgba(235, 235, 245, 0.62);
        display: flex;
        font-size: 13px;
        font-weight: 600;
        gap: 8px;
        letter-spacing: -0.1px;
      }

      .bolt {
        align-items: center;
        position: relative;
        background: linear-gradient(180deg, #1fc99c, #0e8f6f);
        border-radius: 50%;
        box-shadow: 0 4px 14px rgba(18, 163, 127, 0.45);
        display: flex;
        height: 22px;
        justify-content: center;
        width: 22px;
      }

      /* A ring that leaves the bolt as the engine starts to sign. */
      .ring {
        border-radius: 50%;
        box-shadow: 0 0 0 1.5px #4fd1a8;
        inset: 0;
        opacity: 0;
        position: absolute;
      }

      .meta {
        display: flex;
        gap: 6px;
        margin-left: auto;
      }

      .pill {
        background: rgba(120, 120, 128, 0.24);
        border-radius: 999px;
        color: rgba(235, 235, 245, 0.62);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.1px;
        padding: 3px 9px;
      }

      .pill.accent {
        background: rgba(18, 163, 127, 0.24);
        color: #4fd1a8;
      }

      .hex {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 13px;
        left: 18px;
        letter-spacing: 0.4px;
        line-height: 18px;
        position: absolute;
        top: 52px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="card large">
      <div class="glow"></div>
      <div class="panel accounts">
        <div class="select"></div>
      </div>
      <div class="panel signature">
        <div class="head">
          <div class="chip">
            <span class="bolt">
              <svg width="10" height="12" viewBox="0 0 10 12"><path d="M5.9.3 1 6.6c-.2.3 0 .7.4.7h2.9L3.8 11.4c-.1.4.4.6.6.3L9 5.4c.2-.3 0-.7-.4-.7H5.7L6.5.6C6.6.2 6.1 0 5.9.3Z" fill="#fff" /></svg>
              <span class="ring"></span>
            </span>
            <span>“Hello from Expo”</span>
          </div>
          <div class="meta"><span class="pill accent curve"></span><span class="pill time"></span></div>
        </div>
        <div class="hex"></div>
      </div>
    </div>
    <script type="module">
      import {mix, spring} from './anim.js'

      // The example's first account on each chain, as its home screen lists them.
      const CHAINS = [
        {address: '0x9858…da94', curve: 'secp256k1', name: 'Ethereum', network: 'Sepolia', path: "m/44'/60'/0'/0/0", seed: 7, ticker: 'ETH', time: '23.8 µs'},
        {address: 'tb1q6r…pvkl', curve: 'secp256k1', name: 'Bitcoin', network: 'testnet4', path: "m/84'/1'/0'/0/0", seed: 19, ticker: 'BTC', time: '23.8 µs'},
        {address: 'HAgk14…Kpqk', curve: 'Ed25519', name: 'Solana', network: 'devnet', path: "m/44'/501'/0'/0'", seed: 41, ticker: 'SOL', time: '51.3 µs'},
      ]

      const accounts = document.querySelector('.accounts')
      const select = document.querySelector('.select')
      const rows = CHAINS.map(({address, name, network, path, ticker}) => {
        const row = document.createElement('div')
        row.className = 'row'
        row.innerHTML = `<span class="badge">${ticker}</span><div><div class="name">${name}</div><div class="address">${address} · ${network}</div></div><span class="path">${path}</span>`
        accounts.append(row)

        return row
      })
      const badges = rows.map(row => row.querySelector('.badge'))

      // A signature is 64 bytes: four lines of eight groups. Each chain's is
      // its own, from a seeded generator, so the loop draws the same bytes.
      const BYTES = 64
      const GROUP = 4
      const LINE = 32

      const generator = seed => () => {
        seed = (seed + 0x6d2b79f5) | 0
        let value = Math.imul(seed ^ (seed >>> 15), 1 | seed)
        value = (value + Math.imul(value ^ (value >>> 7), 61 | value)) ^ value

        return ((value ^ (value >>> 14)) >>> 0) / 4294967296
      }

      const HEX = '0123456789abcdef'
      const signatures = CHAINS.map(({seed}) => {
        const random = generator(seed)

        return Array.from({length: BYTES * 2}, () => HEX[Math.floor(random() * 16)])
      })

      const hex = document.querySelector('.hex')
      const cells = Array.from({length: BYTES * 2}, (_, index) => {
        const cell = document.createElement('span')

        if (index > 0 && index % LINE === 0) {
          hex.append('\n')
        } else if (index > 0 && index % GROUP === 0) {
          hex.append(' ')
        }

        hex.append(cell)

        return cell
      })

      const ring = document.querySelector('.ring')
      const curve = document.querySelector('.curve')
      const time = document.querySelector('.time')
      const meta = document.querySelector('.meta')

      // Each chain holds the card for PHASE seconds: the selection moves to it,
      // the last signature goes, the new one settles out of noise left to right
      // and line by line, and the pills say what signed it and how fast. The clip
      // starts with Ethereum's signature through, so its first frame (the card's
      // still) shows one done.
      const PHASE = 2.6
      const PERIOD = PHASE * CHAINS.length
      const OFFSET = 1.9
      const ROW = 54

      const GONE = 0.24
      const DECODE = 0.32
      const STAGGER = 0.0055
      const SCRAMBLE = 0.24
      const DONE = DECODE + STAGGER * (BYTES * 2 - 1) + SCRAMBLE

      const clamp = value => Math.min(Math.max(value, 0), 1)
      const out = value => 1 - (1 - clamp(value)) ** 3
      const span = (at, from, length) => clamp((at - from) / length)

      // The noise a byte runs through before it settles: a new digit every
      // other frame at 60, the same on every render.
      const noise = (index, at) => HEX[Math.floor(generator(index * 977 + Math.floor(at * 30))() * 16)]

      await document.fonts.ready

      window.DURATION = PERIOD
      window.FPS = 60

      window.frame = t => {
        const at = (t + OFFSET) % PERIOD
        const index = Math.floor(at / PHASE)
        const local = at - index * PHASE
        const previous = (index + CHAINS.length - 1) % CHAINS.length

        // The selection springs from the last row to this one, wrapping from
        // Solana back up to Ethereum the same way.
        const moved = spring(local, 0.55, 0.8)
        select.style.transform = `translateY(${mix(previous * ROW, index * ROW, moved).toFixed(2)}px)`

        badges.forEach((badge, position) => {
          const lit = position === index ? clamp(moved) : position === previous ? 1 - clamp(moved) : 0
          badge.style.background = `rgba(${Math.round(mix(120, 18, lit))}, ${Math.round(mix(120, 163, lit))}, ${Math.round(mix(128, 127, lit))}, ${mix(0.24, 0.3, lit).toFixed(3)})`
          badge.style.color = lit > 0.5 ? '#4fd1a8' : '#fff'
        })

        // The last signature blurs away, then the new one settles.
        const gone = out(span(local, 0, GONE))

        cells.forEach((cell, position) => {
          const start = DECODE + STAGGER * position
          let text = signatures[previous][position]
          let color = 'rgba(255, 255, 255, 0.86)'
          let opacity = 1 - gone

          if (local >= start + SCRAMBLE) {
            text = signatures[index][position]
            opacity = 1
          } else if (local >= start) {
            text = noise(position, local)
            color = '#4fd1a8'
            opacity = 0.35 + 0.55 * span(local, start, SCRAMBLE * 0.5)
          }

          cell.textContent = text
          cell.style.color = color
          cell.style.opacity = opacity.toFixed(3)
        })
        hex.style.filter = `blur(${(local < DECODE ? gone * 3 : 0).toFixed(2)}px)`

        const pulse = span(local, DECODE - 0.08, 0.7)
        Object.assign(ring.style, {
          opacity: (pulse > 0 ? (1 - pulse) * 0.9 : 0).toFixed(3),
          transform: `scale(${mix(1, 2.2, out(pulse)).toFixed(3)})`,
        })

        // The pills follow the signature: what was, then what is.
        const label = local < DONE - 0.1 ? CHAINS[previous] : CHAINS[index]
        curve.textContent = label.curve
        time.textContent = label.time
        const shown = local < DONE - 0.1 ? 1 - out(span(local, 0, 0.2)) : out(span(local, DONE - 0.1, 0.3))
        Object.assign(meta.style, {
          opacity: shown.toFixed(3),
          transform: `translateY(${mix(4, 0, shown).toFixed(2)}px)`,
        })
      }

      window.frame(0)
    </script>
  </body>
</html>
