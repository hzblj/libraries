<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      /* One recovery phrase and three chains, signing in turn: the example
         wallet's networks (Sepolia, testnet4 and devnet, each account at the
         path its own wallets use), and under them the message the README signs,
         its 64 bytes settling out of noise as the engine hands them over, with
         the curve and what a signature takes through Nitro (the example's
         Performance screen, iOS). Drawn in the example's manner: kara's grouped
         cards and its emerald, each chain under the coin a wallet shows. */
      .glow {
        --glow: 18 163 127;
        --strength: 0.34;
        height: 500px;
        left: 60px;
        top: -30px;
        width: 500px;
      }

      .panel {
        border-radius: 22px;
        font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
        position: absolute;
      }

      .accounts {
        background: #1c1c1e;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.06),
          0 24px 60px rgba(0, 0, 0, 0.5);
        left: 34px;
        padding: 8px;
        top: 36px;
        width: 372px;
      }

      .select {
        background: rgba(18, 163, 127, 0.16);
        border-radius: 15px;
        box-shadow: inset 0 0 0 1px rgba(79, 209, 168, 0.26);
        height: 54px;
        left: 8px;
        position: absolute;
        right: 8px;
        top: 8px;
      }

      .row {
        align-items: center;
        display: flex;
        gap: 12px;
        height: 54px;
        padding: 0 14px 0 10px;
        position: relative;
      }

      /* Kara's hairline between rows, from the text on. */
      .row + .row::before {
        background: rgba(84, 84, 88, 0.5);
        content: '';
        height: 0.5px;
        left: 58px;
        position: absolute;
        right: 14px;
        top: 0;
      }

      /* The chain's coin: its mark on its colour, as wallets list them. */
      .badge {
        align-items: center;
        border-radius: 50%;
        display: flex;
        flex: none;
        height: 36px;
        justify-content: center;
        width: 36px;
      }

      .badge svg {
        display: block;
      }

      .badge.btc svg {
        height: 36px;
        width: 36px;
      }

      .badge.eth {
        background: #627eea;
      }

      .badge.eth svg {
        height: 21px;
        width: 21px;
      }

      .badge.sol {
        background: #000;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      .badge.sol svg {
        height: 17px;
        width: 17px;
      }

      .name {
        color: #fff;
        font-size: 15.5px;
        font-weight: 600;
        letter-spacing: -0.3px;
        line-height: 19px;
      }

      .address {
        color: rgba(235, 235, 245, 0.6);
        font-size: 12.5px;
        letter-spacing: -0.1px;
        line-height: 16px;
        margin-top: 1px;
      }

      .path {
        color: rgba(235, 235, 245, 0.34);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 10.5px;
        margin-left: auto;
      }

      .signature {
        background: #232327;
        box-shadow:
          inset 0 0 0 1px rgba(79, 209, 168, 0.3),
          0 30px 80px rgba(0, 0, 0, 0.6);
        height: 140px;
        left: 186px;
        top: 230px;
        width: 372px;
      }

      .head {
        align-items: center;
        display: flex;
        height: 22px;
        left: 18px;
        position: absolute;
        right: 16px;
        top: 16px;
      }

      .chip {
        align-items: center;
        color: rgba(235, 235, 245, 0.62);
        display: flex;
        font-size: 13px;
        font-weight: 600;
        gap: 8px;
        letter-spacing: -0.1px;
      }

      .bolt {
        align-items: center;
        position: relative;
        background: linear-gradient(180deg, #1fc99c, #0e8f6f);
        border-radius: 50%;
        box-shadow: 0 4px 14px rgba(18, 163, 127, 0.45);
        display: flex;
        height: 22px;
        justify-content: center;
        width: 22px;
      }

      /* A ring that leaves the bolt as the engine starts to sign. */
      .ring {
        border-radius: 50%;
        box-shadow: 0 0 0 1.5px #4fd1a8;
        inset: 0;
        opacity: 0;
        position: absolute;
      }

      .meta {
        display: flex;
        gap: 6px;
        margin-left: auto;
      }

      .pill {
        background: rgba(120, 120, 128, 0.24);
        border-radius: 999px;
        color: rgba(235, 235, 245, 0.62);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.1px;
        padding: 3px 9px;
      }

      .pill.accent {
        background: rgba(18, 163, 127, 0.24);
        color: #4fd1a8;
      }

      .hex {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 13px;
        left: 18px;
        letter-spacing: 0.4px;
        line-height: 18px;
        position: absolute;
        top: 52px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="card large">
      <div class="glow"></div>
      <div class="panel accounts">
        <div class="select"></div>
      </div>
      <div class="panel signature">
        <div class="head">
          <div class="chip">
            <span class="bolt">
              <svg width="10" height="12" viewBox="0 0 10 12"><path d="M5.9.3 1 6.6c-.2.3 0 .7.4.7h2.9L3.8 11.4c-.1.4.4.6.6.3L9 5.4c.2-.3 0-.7-.4-.7H5.7L6.5.6C6.6.2 6.1 0 5.9.3Z" fill="#fff" /></svg>
              <span class="ring"></span>
            </span>
            <span>“Hello from Expo”</span>
          </div>
          <div class="meta"><span class="pill accent curve"></span><span class="pill time"></span></div>
        </div>
        <div class="hex"></div>
      </div>
    </div>
    <script type="module">
      import {mix, spring} from './anim.js'

      // The example's first account on each chain, as its home screen lists them.
      const CHAINS = [
        {address: '0x9858…da94', curve: 'secp256k1', name: 'Ethereum', network: 'Sepolia', path: "m/44'/60'/0'/0/0", seed: 7, ticker: 'ETH', time: '23.8 µs'},
        {address: 'tb1q6r…pvkl', curve: 'secp256k1', name: 'Bitcoin', network: 'testnet4', path: "m/84'/1'/0'/0/0", seed: 19, ticker: 'BTC', time: '23.8 µs'},
        {address: 'HAgk14…Kpqk', curve: 'Ed25519', name: 'Solana', network: 'devnet', path: "m/44'/501'/0'/0'", seed: 41, ticker: 'SOL', time: '51.3 µs'},
      ]

      // The coins' marks are Simple Icons' (CC0). Bitcoin's coin is its own
      // circle, the ₿ cut through it to white; Ethereum's diamond sits on the
      // blue wallets show it on, and Solana's bars run its purple to green.
      const MARKS = {
        BTC: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#fff"/><path fill="#f7931a" d="M23.638 14.904c-1.602 6.43-8.113 10.34-14.542 8.736C2.67 22.05-1.244 15.525.362 9.105 1.962 2.67 8.475-1.243 14.9.358c6.43 1.605 10.342 8.115 8.738 14.548v-.002zm-6.35-4.613c.24-1.59-.974-2.45-2.64-3.03l.54-2.153-1.315-.33-.525 2.107c-.345-.087-.705-.167-1.064-.25l.526-2.127-1.32-.33-.54 2.165c-.285-.067-.565-.132-.84-.2l-1.815-.45-.35 1.407s.975.225.955.236c.535.136.63.486.615.766l-1.477 5.92c-.075.166-.24.406-.614.314.015.02-.96-.24-.96-.24l-.66 1.51 1.71.426.93.242-.54 2.19 1.32.327.54-2.17c.36.1.705.19 1.05.273l-.51 2.154 1.32.33.545-2.19c2.24.427 3.93.257 4.64-1.774.57-1.637-.03-2.58-1.217-3.196.854-.193 1.5-.76 1.68-1.93h.01zm-3.01 4.22c-.404 1.64-3.157.75-4.05.53l.72-2.9c.896.23 3.757.67 3.33 2.37zm.41-4.24c-.37 1.49-2.662.735-3.405.55l.654-2.64c.744.18 3.137.524 2.75 2.084v.006z"/></svg>',
        ETH: '<svg viewBox="0 0 24 24"><path fill="#fff" fill-opacity="0.6" d="M12.056 0 4.69 12.223l7.365 4.354V0z"/><path fill="#fff" d="M12.056 0v16.577l7.365-4.35L12.056 0z"/><path fill="#fff" fill-opacity="0.6" d="M11.944 17.97 4.58 13.62 11.943 24V17.97z"/><path fill="#fff" d="M11.944 17.97V24l7.37-10.38-7.37 4.35z"/></svg>',
        SOL: '<svg viewBox="0 0 24 24"><defs><linearGradient id="sol" x1="2" y1="23" x2="22" y2="1" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9945ff"/><stop offset="1" stop-color="#14f195"/></linearGradient></defs><path fill="url(#sol)" d="m23.8764 18.0313-3.962 4.1393a.9201.9201 0 0 1-.306.2106.9407.9407 0 0 1-.367.0742H.4599a.4689.4689 0 0 1-.2522-.0733.4513.4513 0 0 1-.1696-.1962.4375.4375 0 0 1-.0314-.2545.4438.4438 0 0 1 .117-.2298l3.9649-4.1393a.92.92 0 0 1 .3052-.2102.9407.9407 0 0 1 .3658-.0746H23.54a.4692.4692 0 0 1 .2523.0734.4531.4531 0 0 1 .1697.196.438.438 0 0 1 .0313.2547.4442.4442 0 0 1-.1169.2297zm-3.962-8.3355a.9202.9202 0 0 0-.306-.2106.941.941 0 0 0-.367-.0742H.4599a.4687.4687 0 0 0-.2522.0734.4513.4513 0 0 0-.1696.1961.4376.4376 0 0 0-.0314.2546.444.444 0 0 0 .117.2297l3.9649 4.1394a.9204.9204 0 0 0 .3052.2102c.1154.049.24.0744.3658.0746H23.54a.469.469 0 0 0 .2523-.0734.453.453 0 0 0 .1697-.1961.4382.4382 0 0 0 .0313-.2546.4444.4444 0 0 0-.1169-.2297zM.46 6.7225h18.7815a.9411.9411 0 0 0 .367-.0742.9202.9202 0 0 0 .306-.2106l3.962-4.1394a.4442.4442 0 0 0 .117-.2297.4378.4378 0 0 0-.0314-.2546.453.453 0 0 0-.1697-.196.469.469 0 0 0-.2523-.0734H4.7596a.941.941 0 0 0-.3658.0745.9203.9203 0 0 0-.3052.2102L.1246 5.9687a.4438.4438 0 0 0-.1169.2295.4375.4375 0 0 0 .0312.2544.4512.4512 0 0 0 .1692.196.4689.4689 0 0 0 .2518.0739z"/></svg>',
      }

      const accounts = document.querySelector('.accounts')
      const select = document.querySelector('.select')

      for (const {address, name, network, path, ticker} of CHAINS) {
        const row = document.createElement('div')
        row.className = 'row'
        row.innerHTML = `<span class="badge ${ticker.toLowerCase()}">${MARKS[ticker]}</span><div><div class="name">${name}</div><div class="address">${address} · ${network}</div></div><span class="path">${path}</span>`
        accounts.append(row)
      }

      // A signature is 64 bytes: four lines of eight groups. Each chain's is
      // its own, from a seeded generator, so the loop draws the same bytes.
      const BYTES = 64
      const GROUP = 4
      const LINE = 32

      const generator = seed => () => {
        seed = (seed + 0x6d2b79f5) | 0
        let value = Math.imul(seed ^ (seed >>> 15), 1 | seed)
        value = (value + Math.imul(value ^ (value >>> 7), 61 | value)) ^ value

        return ((value ^ (value >>> 14)) >>> 0) / 4294967296
      }

      const HEX = '0123456789abcdef'
      const signatures = CHAINS.map(({seed}) => {
        const random = generator(seed)

        return Array.from({length: BYTES * 2}, () => HEX[Math.floor(random() * 16)])
      })

      const hex = document.querySelector('.hex')
      const cells = Array.from({length: BYTES * 2}, (_, index) => {
        const cell = document.createElement('span')

        if (index > 0 && index % LINE === 0) {
          hex.append('\n')
        } else if (index > 0 && index % GROUP === 0) {
          hex.append(' ')
        }

        hex.append(cell)

        return cell
      })

      const ring = document.querySelector('.ring')
      const curve = document.querySelector('.curve')
      const time = document.querySelector('.time')
      const meta = document.querySelector('.meta')

      // Each chain holds the card for PHASE seconds: the selection moves to it,
      // the last signature goes, the new one settles out of noise left to right
      // and line by line, and the pills say what signed it and how fast. The clip
      // starts with Ethereum's signature through, so its first frame (the card's
      // still) shows one done.
      const PHASE = 2.6
      const PERIOD = PHASE * CHAINS.length
      const OFFSET = 1.9
      const ROW = 54

      const GONE = 0.24
      const DECODE = 0.32
      const STAGGER = 0.0055
      const SCRAMBLE = 0.24
      const DONE = DECODE + STAGGER * (BYTES * 2 - 1) + SCRAMBLE

      const clamp = value => Math.min(Math.max(value, 0), 1)
      const out = value => 1 - (1 - clamp(value)) ** 3
      const span = (at, from, length) => clamp((at - from) / length)

      // The noise a byte runs through before it settles: a new digit every
      // other frame at 60, the same on every render.
      const noise = (index, at) => HEX[Math.floor(generator(index * 977 + Math.floor(at * 30))() * 16)]

      await document.fonts.ready

      window.DURATION = PERIOD
      window.FPS = 60

      window.frame = t => {
        const at = (t + OFFSET) % PERIOD
        const index = Math.floor(at / PHASE)
        const local = at - index * PHASE
        const previous = (index + CHAINS.length - 1) % CHAINS.length

        // The selection springs from the last row to this one, wrapping from
        // Solana back up to Ethereum the same way.
        const moved = spring(local, 0.55, 0.8)
        select.style.transform = `translateY(${mix(previous * ROW, index * ROW, moved).toFixed(2)}px)`

        // The last signature blurs away, then the new one settles.
        const gone = out(span(local, 0, GONE))

        cells.forEach((cell, position) => {
          const start = DECODE + STAGGER * position
          let text = signatures[previous][position]
          let color = 'rgba(255, 255, 255, 0.86)'
          let opacity = 1 - gone

          if (local >= start + SCRAMBLE) {
            text = signatures[index][position]
            opacity = 1
          } else if (local >= start) {
            text = noise(position, local)
            color = '#4fd1a8'
            opacity = 0.35 + 0.55 * span(local, start, SCRAMBLE * 0.5)
          }

          cell.textContent = text
          cell.style.color = color
          cell.style.opacity = opacity.toFixed(3)
        })
        hex.style.filter = `blur(${(local < DECODE ? gone * 3 : 0).toFixed(2)}px)`

        const pulse = span(local, DECODE - 0.08, 0.7)
        Object.assign(ring.style, {
          opacity: (pulse > 0 ? (1 - pulse) * 0.9 : 0).toFixed(3),
          transform: `scale(${mix(1, 2.2, out(pulse)).toFixed(3)})`,
        })

        // The pills follow the signature: what was, then what is.
        const label = local < DONE - 0.1 ? CHAINS[previous] : CHAINS[index]
        curve.textContent = label.curve
        time.textContent = label.time
        const shown = local < DONE - 0.1 ? 1 - out(span(local, 0, 0.2)) : out(span(local, DONE - 0.1, 0.3))
        Object.assign(meta.style, {
          opacity: shown.toFixed(3),
          transform: `translateY(${mix(4, 0, shown).toFixed(2)}px)`,
        })
      }

      window.frame(0)
    </script>
  </body>
</html>
