<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      /* A password stretched into a key and a wallet sealed under it: the 64
         MiB Argon2id fills, a block for each cell, in order, one lane, each
         block mixed from an earlier one (lit as it is read), three passes over
         the whole, every one deeper. Then the memory is zeroed before it goes
         back, the count running down to nothing, and what is left is the
         backup, sealed: 87 bytes, the header and the sealed entropy, safe in
         iCloud Keychain or anywhere else. In pink, apart from Crypto's emerald,
         Airgap's indigo and the Vault's amber. */
      .glow {
        --glow: 236 72 153;
        --strength: 0.28;
        height: 260px;
        left: -40px;
        top: -60px;
        width: 260px;
      }

      .memory {
        background: #1c1c1e;
        border-radius: 16px;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.06),
          0 14px 34px rgba(0, 0, 0, 0.5);
        display: grid;
        gap: 3px;
        grid-template-columns: repeat(8, 1fr);
        height: 123px;
        left: 22px;
        padding: 8px;
        position: absolute;
        top: 22px;
        width: 123px;
      }

      .memory i {
        border-radius: 3px;
        display: block;
      }

      /* The seal, over the zeroed memory once the backup is made. */
      .seal {
        align-items: center;
        background: linear-gradient(180deg, #f472b6, #db2777);
        border-radius: 50%;
        box-shadow: 0 6px 22px rgba(236, 72, 153, 0.55);
        display: flex;
        height: 40px;
        justify-content: center;
        left: 63.5px;
        position: absolute;
        top: 63.5px;
        width: 40px;
      }

      /* What the engine is doing: the format, the memory it holds, the pass,
         a bar for each of the three. */
      .status {
        font-family: Inter, system-ui, sans-serif;
        left: 162px;
        position: absolute;
        right: 16px;
        top: 26px;
      }

      .type {
        color: rgba(255, 255, 255, 0.42);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 9.5px;
        letter-spacing: 0.1px;
      }

      .amount {
        align-items: center;
        display: flex;
        font-size: 26px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        gap: 7px;
        height: 32px;
        letter-spacing: -0.6px;
        margin-top: 5px;
        white-space: nowrap;
      }

      .check {
        align-items: center;
        background: linear-gradient(180deg, #f472b6, #db2777);
        border-radius: 50%;
        box-shadow: 0 4px 14px rgba(236, 72, 153, 0.55);
        display: flex;
        flex: none;
        height: 20px;
        justify-content: center;
        width: 20px;
      }

      .step {
        color: rgba(255, 255, 255, 0.5);
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
        margin-top: 1px;
        white-space: nowrap;
      }

      .passes {
        display: grid;
        gap: 4px;
        grid-template-columns: repeat(3, 1fr);
        margin-top: 12px;
      }

      .passes span {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        display: block;
        height: 6px;
        overflow: hidden;
      }

      .passes b {
        background: #ec4899;
        display: block;
        height: 100%;
        transform-origin: left;
      }
    </style>
  </head>
  <body>
    <div class="card small">
      <div class="glow"></div>
      <div class="memory"></div>
      <div class="seal"><svg width="16" height="19" viewBox="0 0 10 12"><path d="M2.8 5.2V3.7a2.2 2.2 0 0 1 4.4 0v1.5" fill="none" stroke="#fff" stroke-width="1.4" /><rect x="1" y="5" width="8" height="6.4" rx="1.6" fill="#fff" /></svg></div>
      <div class="status">
        <div class="type">ncbk · argon2id</div>
        <div class="amount"><span class="figure"></span><span class="check"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1.2 4.2 3.8 6.6 8.8 1.4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg></span></div>
        <div class="step"></div>
        <div class="passes"><span><b></b></span><span><b></b></span><span><b></b></span></div>
      </div>
    </div>
    <script type="module">
      import {mix, spring} from './anim.js'

      const generator = seed => () => {
        seed = (seed + 0x6d2b79f5) | 0
        let value = Math.imul(seed ^ (seed >>> 15), 1 | seed)
        value = (value + Math.imul(value ^ (value >>> 7), 61 | value)) ^ value

        return ((value ^ (value >>> 14)) >>> 0) / 4294967296
      }

      // 64 MiB as 64 cells, a MiB to a cell. Argon2id with one lane fills
      // them in order, and every block is mixed from one written before it: in
      // the first pass an earlier one, in the later passes any other.
      const BLOCKS = 64
      const PASSES = 3
      const random = generator(31)
      const references = Array.from({length: PASSES}, (_, pass) =>
        Array.from({length: BLOCKS}, (_, block) => {
          if (pass === 0) {
            return block < 2 ? -1 : Math.floor(random() * (block - 1))
          }

          const other = Math.floor(random() * (BLOCKS - 1))

          return other >= block ? other + 1 : other
        })
      )

      // How deep a cell is after each pass: every pass writes over the last.
      const LEVELS = [0.3, 0.56, 0.86]

      const START = 0.25
      const PASS = 0.8
      const WRITE = PASS / BLOCKS
      const END = START + PASS * PASSES
      const WIPE = END + 0.1
      const ZERO = 0.004
      const SEALED = WIPE + ZERO * BLOCKS + 0.1
      // A whole number of frames, so the loop lands back on its first.
      const PERIOD = 5.2
      const RESET = PERIOD - 0.5

      // The clip starts in the second pass, so its first frame (the card's
      // still) shows the memory half deepened.
      const OFFSET = 1.45

      const cells = Array.from({length: BLOCKS}, () => {
        const cell = document.createElement('i')
        document.querySelector('.memory').append(cell)

        return cell
      })
      const figure = document.querySelector('.figure')
      const check = document.querySelector('.check')
      const step = document.querySelector('.step')
      const bars = [...document.querySelectorAll('.passes b')]
      const amount = document.querySelector('.amount')
      const seal = document.querySelector('.seal')

      const clamp = value => Math.min(Math.max(value, 0), 1)
      const written = (pass, block) => START + pass * PASS + block * WRITE

      await document.fonts.ready

      window.DURATION = PERIOD
      window.FPS = 60

      window.frame = t => {
        const at = (t + OFFSET) % PERIOD
        const pass = Math.min(Math.floor((at - START) / PASS), PASSES - 1)

        // Read as they are mixed in: the blocks written in the last tenth of a
        // second light the ones they read.
        const read = new Map()

        for (let back = 0; back < PASSES * BLOCKS; back++) {
          const p = Math.floor(back / BLOCKS)
          const block = back % BLOCKS
          const since = at - written(p, block)

          if (since >= 0 && since < 0.1 && references[p][block] >= 0) {
            const reference = references[p][block]
            read.set(reference, Math.max(read.get(reference) ?? 0, 1 - since / 0.1))
          }
        }

        cells.forEach((cell, block) => {
          let level = 0
          let flash = 0

          for (let p = 0; p < PASSES; p++) {
            const since = at - written(p, block)

            if (since >= 0) {
              level = LEVELS[p]
              flash = clamp(1 - since / 0.15)
            }
          }

          // Zeroed before it goes back, block by block.
          level *= 1 - clamp((at - WIPE - block * ZERO) / 0.08)
          const lit = read.get(block) ?? 0
          const white = Math.max(flash, lit * 0.6)
          cell.style.background =
            level > 0 || white > 0
              ? `rgba(${Math.round(mix(236, 255, white))}, ${Math.round(mix(72, 230, white))}, ${Math.round(mix(153, 242, white))}, ${Math.max(level, white * 0.9, 0.07).toFixed(3)})`
              : 'rgba(255, 255, 255, 0.07)'
        })

        // The memory counts up through the first pass, holds, and runs down to
        // nothing as it is zeroed; then the backup it leaves.
        const sealed = at >= SEALED
        const held = at < START + PASS ? Math.round(clamp((at - START) / PASS) * 64) : 64
        const left = Math.round(held * (1 - clamp((at - WIPE) / (ZERO * BLOCKS))))
        figure.textContent = sealed ? '87 B' : `${left} MiB`
        step.textContent = sealed ? 'For iCloud Keychain' : at >= END ? 'Zeroing memory' : `Pass ${Math.max(pass, 0) + 1} of ${PASSES}`
        step.style.color = sealed ? '#f9a8d4' : 'rgba(255, 255, 255, 0.5)'

        const shown = sealed ? spring(at - SEALED, 0.5, 0.6) : 0
        Object.assign(check.style, {opacity: clamp(shown).toFixed(3), transform: `scale(${mix(0.4, 1, shown).toFixed(3)})`})

        const clear = clamp((at - RESET) / 0.3)
        const closed = sealed ? spring(at - SEALED - 0.05, 0.5, 0.6) : 0
        Object.assign(seal.style, {
          opacity: (clamp(closed) * (1 - clear)).toFixed(3),
          transform: `scale(${(mix(0.5, 1, closed) * mix(1, 0.9, clear)).toFixed(3)})`,
        })
        bars.forEach((bar, index) => {
          bar.style.transform = `scaleX(${clamp((at - START - index * PASS) / PASS).toFixed(4)})`
          bar.style.opacity = (1 - clear).toFixed(3)
        })

        // The status fades out with the reset and back in from nothing.
        const status = (1 - clear) * clamp(at / 0.25)
        amount.style.opacity = status.toFixed(3)
        step.style.opacity = status.toFixed(3)
      }

      window.frame(0)
    </script>
  </body>
</html>
