<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <link rel="stylesheet" href="libraries-grid.css" />
    <style>
      /* The site's link preview, the way the portfolio's is made: the grid as the
         site draws it, held on the profile card with the cards around it
         running off every edge, far enough out that each big corner card shows
         its subject. Built from the cards' own stills, so it follows them when
         they are drawn again. */
      body {
        background: #000;
      }

      .stage {
        height: 630px;
        overflow: hidden;
        position: relative;
        width: 1200px;
      }
    </style>
  </head>
  <body>
    <div class="stage"><div class="grid"></div></div>
    <script type="module">
      import {buildGrid} from './libraries-grid.js'

      const SCALE = 0.8
      const SIZE = {height: 630, width: 1200}

      const grid = document.querySelector('.grid')
      const {centre} = buildGrid(grid)

      grid.style.transform = `translate(${SIZE.width / 2 - centre.x * SCALE}px, ${SIZE.height / 2 - centre.y * SCALE}px) scale(${SCALE})`
    </script>
  </body>
</html>
