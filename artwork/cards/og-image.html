<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      /* The site's link preview, the way the portfolio's is made: the grid as the
         site draws it, closer in, held on the profile card with the cards
         around it running off every edge. Built from the cards' own stills, so
         it follows them when they are drawn again. */
      body {
        background: #000;
      }

      .stage {
        height: 630px;
        overflow: hidden;
        position: relative;
        width: 1200px;
      }

      .grid {
        left: 0;
        position: absolute;
        top: 0;
        transform-origin: 0 0;
      }

      .tile {
        background: linear-gradient(98deg, #202020 0%, #111111 100%);
        border-radius: 16px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        overflow: hidden;
        position: absolute;
      }

      .tile img {
        border-radius: 15px;
        height: calc(100% - 2px);
        left: 1px;
        object-fit: cover;
        position: absolute;
        top: 1px;
        width: calc(100% - 2px);
      }

      /* The paper the scene lays over every card, multiplied in. */
      .tile::after {
        background: url('/public/jpg/texture-paper.jpg') center / cover;
        border-radius: 15px;
        content: '';
        inset: 1px;
        mix-blend-mode: multiply;
        opacity: 0.18;
        position: absolute;
      }

      .ink {
        background: linear-gradient(180deg, #ffffff, rgba(255, 255, 255, 0.48));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .label {
        bottom: 18px;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 500;
        left: 18px;
        position: absolute;
        z-index: 1;
      }

      .label .title {
        font-size: 14px;
        line-height: 18px;
      }

      .label .subtitle {
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
        line-height: 16px;
        margin-top: 1px;
      }

      .profile {
        align-items: center;
        display: flex;
        flex-direction: column;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 500;
      }

      .profile .handle {
        font-size: 20px;
        line-height: 26px;
        margin-top: 61px;
      }

      .profile .tagline {
        color: rgba(255, 255, 255, 0.5);
        font-size: 15px;
        line-height: 20px;
        margin-top: 4px;
      }

      .profile .links {
        align-items: center;
        display: flex;
        font-size: 14px;
        font-weight: 400;
        gap: 12px;
        line-height: 21px;
        margin-top: 22px;
      }

      .profile .dot {
        background: rgba(255, 255, 255, 0.6);
        border-radius: 2px;
        height: 4px;
        width: 4px;
      }
    </style>
  </head>
  <body>
    <div class="stage"><div class="grid"></div></div>
    <script>
      // Mirrors src/scene/grid/layout.ts and the titles in src/db/index.ts.
      const TEMPLATE = ['l1 l1 s1 s2 s6', 'l1 l1 profile l2 l2', 's5 s3 s4 l2 l2']
      const CARDS = {
        l1: {image: 'kara-ui', subtitle: 'Design system for Expo', title: 'Kara'},
        l2: {image: 'expo-zoom-transition', subtitle: 'Expo Router transitions', title: 'Zoom Transition'},
        s1: {image: 'expo-app-icons', subtitle: 'Switch icons at runtime', title: 'App Icons'},
        s2: {image: 'react-native-expo-monorepo', subtitle: 'Turborepo starter for Expo', title: 'Expo Monorepo'},
        s3: {image: 'expo-flags-kit', subtitle: '255 country flags', title: 'Flags Kit'},
        s4: {image: 'expo-rich-haptics', subtitle: 'Haptic patterns for Expo', title: 'Rich Haptics'},
        s5: {image: 'zyplot', subtitle: 'Native charts everywhere', title: 'Zyplot'},
        s6: {image: 'portfolio', subtitle: 'Apps, work and CV', title: 'Portfolio'},
      }
      const COLUMN = 290
      const ROW = 218
      const GAP = 16
      const PADDING = 2
      const SCALE = 1.25
      const SIZE = {height: 630, width: 1200}

      const bounds = new Map()
      TEMPLATE.forEach((row, top) =>
        row.split(' ').forEach((name, left) => {
          const current = bounds.get(name) ?? {bottom: top, left, right: left, top}
          bounds.set(name, {
            bottom: Math.max(current.bottom, top),
            left: Math.min(current.left, left),
            right: Math.max(current.right, left),
            top: Math.min(current.top, top),
          })
        })
      )

      const grid = document.querySelector('.grid')
      let centre = {x: 0, y: 0}

      for (const [name, {left, right, top, bottom}] of bounds) {
        const rect = {
          height: (bottom - top + 1) * (ROW + GAP) - GAP,
          width: (right - left + 1) * (COLUMN + GAP) - GAP,
          x: PADDING + left * (COLUMN + GAP),
          y: PADDING + top * (ROW + GAP),
        }
        const tile = document.createElement('div')
        tile.className = 'tile'
        Object.assign(tile.style, {
          height: `${rect.height}px`,
          left: `${rect.x}px`,
          top: `${rect.y}px`,
          width: `${rect.width}px`,
        })

        if (name === 'profile') {
          centre = {x: rect.x + rect.width / 2, y: rect.y + rect.height / 2}
          tile.innerHTML = `<div class="profile">
            <div class="handle ink">hzblj</div>
            <div class="tagline">Libraries for <span class="ink">Expo</span></div>
            <div class="links"><span class="ink">GitHub</span><span class="dot"></span><span class="ink">npm</span></div>
          </div>`
        } else {
          const card = CARDS[name]
          tile.innerHTML = `<img src="/public/libraries/${card.image}.png" />
            <div class="label"><div class="title ink">${card.title}</div><div class="subtitle">${card.subtitle}</div></div>`
        }

        grid.append(tile)
      }

      grid.style.transform = `translate(${SIZE.width / 2 - centre.x * SCALE}px, ${SIZE.height / 2 - centre.y * SCALE}px) scale(${SCALE})`
    </script>
  </body>
</html>
