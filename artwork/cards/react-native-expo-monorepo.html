<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      /* The starter's own tree, as an editor's sidebar shows it, with the
         selection walking through the app and each package in turn, and what
         that package is for at the right of it. */
      .tree {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
        left: 34px;
        letter-spacing: -0.1px;
        position: absolute;
        right: 34px;
        top: 14px;
      }

      .row {
        align-items: center;
        display: flex;
        gap: 8px;
        height: 21px;
        position: relative;
        white-space: nowrap;
        z-index: 1;
      }

      .row.nested {
        padding-left: 24px;
      }

      .row.nested::before {
        background: rgba(255, 255, 255, 0.1);
        bottom: 0;
        content: '';
        left: 5px;
        position: absolute;
        top: 0;
        width: 1px;
      }

      .glyph {
        flex: none;
        height: 12px;
        width: 12px;
      }

      .selection {
        background: rgba(255, 255, 255, 0.075);
        border-radius: 7px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09);
        height: 21px;
        left: 14px;
        position: absolute;
        right: 0;
        top: 0;
      }

      .role {
        color: rgba(255, 255, 255, 0.5);
        font-family: Inter, system-ui, sans-serif;
        font-size: 10px;
        font-weight: 500;
        line-height: 21px;
        position: absolute;
        right: 10px;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div class="card small">
      <div class="tree">
        <div class="selection"></div>
      </div>
    </div>
    <script type="module">
      import {mix, spring} from './anim.js'

      const FOLDER =
        '<path d="M3 4.5 6 7.5l3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />'
      const APP = '<rect x="2.5" y="1" width="7" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.2" />'
      const PACKAGE =
        '<path d="M6 1.2 10.5 3.6v4.8L6 10.8 1.5 8.4V3.6Z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round" />'

      const ROWS = [
        {glyph: FOLDER, name: 'apps'},
        {glyph: APP, name: 'expo-demo', role: 'Expo app'},
        {glyph: FOLDER, name: 'packages'},
        {glyph: PACKAGE, name: 'core-ui', role: 'Components'},
        {glyph: PACKAGE, name: 'core-themes', role: 'Tokens'},
        {glyph: PACKAGE, name: 'core-store', role: 'Zustand'},
        {glyph: PACKAGE, name: 'feature-home', role: 'Feature'},
      ]

      const ROW = 21
      const STEP = 1.2
      const STOPS = ROWS.flatMap((row, index) => (row.role ? [index] : []))

      const tree = document.querySelector('.tree')
      const selection = document.querySelector('.selection')

      const rows = ROWS.map(({glyph, name, role}) => {
        const row = document.createElement('div')
        row.className = `row${role ? ' nested' : ''}`
        row.innerHTML = `<svg class="glyph" viewBox="0 0 12 12">${glyph}</svg>${name}`
        tree.append(row)

        return {folder: !role, row}
      })

      const roles = STOPS.map(index => {
        const label = document.createElement('div')
        label.className = 'role'
        label.textContent = ROWS[index].role
        tree.append(label)

        return label
      })

      window.DURATION = STEP * STOPS.length

      window.frame = t => {
        const step = Math.floor(t / STEP) % STOPS.length
        const from = STOPS[step]
        const to = STOPS[(step + 1) % STOPS.length]
        // Holds on a package, then springs to the next one.
        const travel = spring(t - step * STEP - 0.55, 0.6)
        const at = mix(from, to, travel)

        selection.style.transform = `translateY(${at * ROW}px)`

        rows.forEach(({folder, row}, index) => {
          const near = Math.max(0, 1 - Math.abs(index - at))
          row.style.color = folder
            ? 'rgba(255, 255, 255, 0.85)'
            : `rgba(255, 255, 255, ${mix(0.5, 1, near).toFixed(3)})`
        })

        roles.forEach((label, index) => {
          const near = Math.max(0, 1 - Math.abs(STOPS[index] - at) * 1.6)
          label.style.opacity = String(near)
          label.style.transform = `translateY(${at * ROW}px)`
        })
      }

      window.frame(0)
    </script>
  </body>
</html>
