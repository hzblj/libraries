<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      /* Two phones, iOS and Android. This page draws only their frames: the
         screens are the website's recordings, which render.mjs lays into
         them (PHONE there has to match the boxes here). */
      .phone {
        background: #000;
        border-radius: 30px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.13),
          0 30px 70px rgba(0, 0, 0, 0.65),
          0 6px 16px rgba(0, 0, 0, 0.45);
        height: 372px;
        position: absolute;
        top: 20px;
        width: 176px;
      }

      .phone::after {
        background: #1a1a1a;
        border-radius: 30px;
        content: '';
        inset: 0;
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        padding: 4px;
        position: absolute;
      }

      .glow {
        background: radial-gradient(closest-side, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0));
        height: 440px;
        left: 78px;
        position: absolute;
        top: 6px;
        width: 440px;
      }
    </style>
  </head>
  <body>
    <div class="card large">
      <div class="glow"></div>
      <div class="phone" style="left: 104px"></div>
      <div class="phone" style="left: 316px"></div>
    </div>
  </body>
</html>
